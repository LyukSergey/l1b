# Зміна 001 — створення таблиць товару.
#
# Схема точно відповідає JPA-сутностям (Product, Characteristic) із заняття 2/1,
# бо Hibernate тепер працює в режимі ddl-auto=validate: він НЕ створює таблиці, а лише
# перевіряє, що вони збігаються з сутностями. Якщо тип/ім'я колонки не збігеться —
# застосунок не стартує. Тому імена й типи колонок узгоджено з анотаціями сутностей:
#   products                -> @Entity @Table(name = "products")
#   product_images          -> @ElementCollection @CollectionTable(name = "product_images")
#   product_characteristics -> @ElementCollection @CollectionTable(name = "product_characteristics")
databaseChangeLog:
  - changeSet:
      id: 001-create-products
      author: amazonua
      changes:
        # --- Основна таблиця товарів ---
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true          # у Postgres -> GENERATED BY DEFAULT AS IDENTITY
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false            # @Column(nullable = false)
              - column:
                  name: price
                  type: numeric(19, 2)         # BigDecimal -> numeric
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: varchar(255)
              - column:
                  name: description
                  type: varchar(2000)          # @Column(length = 2000)
              - column:
                  name: category
                  type: varchar(255)

        # --- Галерея фото (колекція значень товару) ---
        - createTable:
            tableName: product_images
            columns:
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: varchar(255)
              - column:
                  name: position              # @OrderColumn — зберігає порядок елементів
                  type: integer
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_product_images_product
            baseTableName: product_images
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id

        # --- Характеристики (колекція вбудовуваних значень @Embeddable Characteristic) ---
        - createTable:
            tableName: product_characteristics
            columns:
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: char_name            # @Column(name = "char_name")
                  type: varchar(255)
              - column:
                  name: char_value           # char_value, бо VALUE — зарезервоване слово SQL
                  type: varchar(255)
              - column:
                  name: position
                  type: integer
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_product_characteristics_product
            baseTableName: product_characteristics
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
