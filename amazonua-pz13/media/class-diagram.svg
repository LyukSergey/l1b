<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <defs>
    <marker id="arrowOpen" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,5 L1,9" fill="none" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="triangle" markerWidth="16" markerHeight="16" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L13,6 L1,11 Z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#f8fafc"/>
  <text x="440" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Цільова діаграма класів: приклад «фільмотека» (Movie)</text>
  <text x="440" y="56" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">ваша сутність і поля — власні; тут Movie лише як зразок структури</text>

  <!-- Controller -->
  <rect x="40" y="80" width="240" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="102" font-family="monospace" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">MovieController</text>
  <text x="160" y="118" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">«web» @RestController</text>
  <line x1="40" y1="126" x2="280" y2="126" stroke="#2563eb"/>
  <text x="52" y="146" font-family="monospace" font-size="10" fill="#334155">+ list(): List&lt;MovieCardDto&gt;</text>
  <text x="52" y="162" font-family="monospace" font-size="10" fill="#334155">+ getOne(id): MovieDetailDto</text>
  <text x="52" y="178" font-family="monospace" font-size="10" fill="#334155">+ create / update / delete</text>

  <!-- Service interface -->
  <rect x="330" y="80" width="230" height="86" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="445" y="100" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">«interface»</text>
  <text x="445" y="116" font-family="monospace" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">MovieService</text>
  <line x1="330" y1="124" x2="560" y2="124" stroke="#334155"/>
  <text x="342" y="144" font-family="monospace" font-size="10" fill="#334155">findAll / findById</text>
  <text x="342" y="160" font-family="monospace" font-size="10" fill="#334155">create / update / delete</text>

  <!-- Service impl -->
  <rect x="330" y="230" width="230" height="70" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="445" y="250" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">«service» @Service</text>
  <text x="445" y="268" font-family="monospace" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">MovieServiceImpl</text>
  <line x1="330" y1="276" x2="560" y2="276" stroke="#334155"/>
  <text x="342" y="293" font-family="monospace" font-size="10" fill="#64748b">- repository, - mapper</text>

  <!-- Repository interface -->
  <rect x="620" y="80" width="230" height="86" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="735" y="100" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">«interface»</text>
  <text x="735" y="116" font-family="monospace" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">MovieRepository</text>
  <line x1="620" y1="124" x2="850" y2="124" stroke="#334155"/>
  <text x="632" y="144" font-family="monospace" font-size="10" fill="#334155">findAll / findById</text>
  <text x="632" y="160" font-family="monospace" font-size="10" fill="#334155">save / deleteById</text>

  <!-- Repository impl -->
  <rect x="620" y="230" width="230" height="70" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="735" y="250" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">«repository» @Repository</text>
  <text x="735" y="268" font-family="monospace" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">InMemoryMovieRepository</text>
  <line x1="620" y1="276" x2="850" y2="276" stroke="#334155"/>
  <text x="632" y="293" font-family="monospace" font-size="10" fill="#64748b">Map&lt;Long, Movie&gt;</text>

  <!-- Domain -->
  <rect x="330" y="370" width="230" height="140" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="445" y="390" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">«domain»</text>
  <text x="445" y="406" font-family="monospace" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Movie</text>
  <line x1="330" y1="414" x2="560" y2="414" stroke="#334155"/>
  <g font-family="monospace" font-size="10" fill="#334155">
    <text x="342" y="434">- id: Long</text>
    <text x="342" y="450">- title: String</text>
    <text x="342" y="466">- director: String</text>
    <text x="342" y="482">- year: Integer</text>
    <text x="342" y="498">- genre, rating, posterUrl</text>
  </g>

  <!-- DTOs -->
  <rect x="40" y="370" width="240" height="140" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="390" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">«web/dto» (record)</text>
  <text x="160" y="408" font-family="monospace" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">MovieCardDto</text>
  <line x1="40" y1="416" x2="280" y2="416" stroke="#94a3b8"/>
  <text x="52" y="434" font-family="monospace" font-size="9" fill="#334155">id, title, director, year</text>
  <text x="160" y="456" font-family="monospace" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">MovieDetailDto</text>
  <text x="52" y="474" font-family="monospace" font-size="9" fill="#334155">+ genre, rating, posterUrl…</text>
  <text x="160" y="496" font-family="monospace" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">MovieRequest (вхід)</text>

  <!-- relations -->
  <path d="M280,124 L328,122" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowOpen)"/>
  <path d="M560,124 L618,122" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowOpen)"/>
  <path d="M445,230 L445,168" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#triangle)"/>
  <path d="M735,230 L735,168" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#triangle)"/>
  <path d="M445,300 L445,368" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowOpen)"/>

  <text x="300" y="112" font-family="sans-serif" font-size="9" fill="#64748b">залежить →</text>
  <text x="588" y="205" font-family="sans-serif" font-size="9" fill="#64748b">реалізує - -▷</text>
</svg>
