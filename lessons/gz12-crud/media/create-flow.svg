<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="330" fill="#f8fafc"/>
  <text x="440" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Проходження запиту створення (POST)</text>

  <!-- top row -->
  <rect x="30" y="70" width="180" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="96" font-family="monospace" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">POST /api/products</text>
  <text x="120" y="116" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">JSON у тілі запиту</text>

  <rect x="250" y="70" width="180" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="340" y="96" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">ProductController</text>
  <text x="340" y="116" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">@RequestBody ProductRequest</text>

  <rect x="470" y="70" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="560" y="96" font-family="sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">ProductMapper</text>
  <text x="560" y="116" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">toDomain: Request → Product</text>

  <rect x="690" y="70" width="170" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="775" y="96" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">Repository.save</text>
  <text x="775" y="116" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">призначає id</text>

  <path d="M212,100 L248,100" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M432,100 L468,100" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M652,100 L688,100" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- return -->
  <rect x="470" y="210" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="560" y="236" font-family="sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">ProductMapper</text>
  <text x="560" y="256" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">toDetail: Product → DTO</text>

  <rect x="250" y="210" width="180" height="60" rx="10" fill="#2563eb"/>
  <text x="340" y="236" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">201 Created</text>
  <text x="340" y="256" font-family="sans-serif" font-size="11" fill="#dbeafe" text-anchor="middle">JSON створеного товару</text>

  <path d="M775,130 C775,175 700,240 652,240" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M468,240 L432,240" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <text x="440" y="310" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">вхідний JSON → доменний об'єкт → збереження → вихідний DTO з кодом 201</text>
</svg>
