<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
  <rect width="860" height="360" fill="#f8fafc"/>
  <text x="430" y="36" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Операції CRUD та HTTP-методи</text>

  <g>
    <!-- Create -->
    <rect x="40" y="70" width="180" height="250" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="40" y="70" width="180" height="46" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="130" y="99" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Create</text>
    <text x="130" y="150" font-family="monospace" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">POST</text>
    <text x="130" y="185" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">/api/products</text>
    <text x="130" y="230" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">створити товар</text>
    <text x="130" y="290" font-family="sans-serif" font-size="12" fill="#0ea5e9" text-anchor="middle">→ 201 Created</text>

    <!-- Read -->
    <rect x="240" y="70" width="180" height="250" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="240" y="70" width="180" height="46" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="330" y="99" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Read</text>
    <text x="330" y="150" font-family="monospace" font-size="17" font-weight="700" fill="#0ea5e9" text-anchor="middle">GET</text>
    <text x="330" y="185" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">/api/products[/{id}]</text>
    <text x="330" y="230" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">перелік / один</text>
    <text x="330" y="290" font-family="sans-serif" font-size="12" fill="#0ea5e9" text-anchor="middle">→ 200 OK</text>

    <!-- Update -->
    <rect x="440" y="70" width="180" height="250" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="440" y="70" width="180" height="46" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="530" y="99" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Update</text>
    <text x="530" y="150" font-family="monospace" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">PUT</text>
    <text x="530" y="185" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">/api/products/{id}</text>
    <text x="530" y="230" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">замінити товар</text>
    <text x="530" y="290" font-family="sans-serif" font-size="12" fill="#0ea5e9" text-anchor="middle">→ 200 OK</text>

    <!-- Delete -->
    <rect x="640" y="70" width="180" height="250" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="640" y="70" width="180" height="46" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="730" y="99" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Delete</text>
    <text x="730" y="150" font-family="monospace" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">DELETE</text>
    <text x="730" y="185" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">/api/products/{id}</text>
    <text x="730" y="230" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">видалити товар</text>
    <text x="730" y="290" font-family="sans-serif" font-size="12" fill="#0ea5e9" text-anchor="middle">→ 204 No Content</text>
  </g>

  <text x="430" y="348" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Read реалізовано на 1.1; Create/Update/Delete додаємо на 1.2</text>
</svg>
