<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" font-family="sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#334155">Набір змін Liquibase для вашого проєкту (приклад: книгарня)</text>

  <!-- master -->
  <rect x="285" y="58" width="250" height="58" rx="10" fill="#2563eb"/>
  <text x="410" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">db.changelog-master.yaml</text>
  <text x="410" y="101" text-anchor="middle" font-size="12" fill="#e0f2fe">include по черзі</text>

  <line x1="410" y1="116" x2="230" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <line x1="410" y1="116" x2="590" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <rect x="70" y="170" width="320" height="64" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="230" y="194" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">001-create-books.yaml</text>
  <text x="230" y="214" text-anchor="middle" font-size="12" fill="#64748b">changeSet: createTable books</text>
  <text x="230" y="230" text-anchor="middle" font-size="12" fill="#64748b">(+ таблиці колекцій, якщо є)</text>

  <rect x="430" y="170" width="320" height="64" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="590" y="194" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">002-seed-books.yaml</text>
  <text x="590" y="214" text-anchor="middle" font-size="12" fill="#64748b">changeSet: insert стартових</text>
  <text x="590" y="230" text-anchor="middle" font-size="12" fill="#64748b">книг (дані)</text>

  <line x1="410" y1="234" x2="410" y2="282" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>

  <rect x="255" y="286" width="310" height="62" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="410" y="310" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">PostgreSQL: таблиця books</text>
  <text x="410" y="330" text-anchor="middle" font-size="12" fill="#64748b">id, title, author, price, year, ...</text>

  <rect x="150" y="372" width="520" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="410" y="397" text-anchor="middle" font-size="12.5" fill="#334155">+ службові: databasechangelog, databasechangeloglock (веде Liquibase)</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#2563eb"/>
