<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="sans-serif">
  <rect width="860" height="420" fill="#f8fafc"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#334155">Хто створює схему БД</text>

  <!-- БУЛО -->
  <text x="215" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#64748b">Було (2/1): ddl-auto=update</text>
  <!-- Hibernate -->
  <rect x="95" y="90" width="240" height="56" rx="10" fill="#2563eb"/>
  <text x="215" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Hibernate</text>
  <text x="215" y="133" text-anchor="middle" font-size="12" fill="#e0f2fe">генерує схему зі сутностей</text>
  <!-- arrow down -->
  <line x1="215" y1="146" x2="215" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <!-- DB -->
  <rect x="115" y="200" width="200" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="215" y="224" text-anchor="middle" font-size="14" fill="#334155">Таблиці в PostgreSQL</text>
  <text x="215" y="243" text-anchor="middle" font-size="12" fill="#64748b">схема не під контролем</text>
  <!-- minus note -->
  <rect x="95" y="286" width="240" height="96" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
  <text x="215" y="308" text-anchor="middle" font-size="12.5" fill="#334155">Проблема у проді:</text>
  <text x="215" y="330" text-anchor="middle" font-size="12" fill="#64748b">немає історії змін,</text>
  <text x="215" y="348" text-anchor="middle" font-size="12" fill="#64748b">немає rollback,</text>
  <text x="215" y="366" text-anchor="middle" font-size="12" fill="#64748b">зміни неявні й ризиковані</text>

  <!-- розділювач -->
  <line x1="430" y1="60" x2="430" y2="390" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- СТАЛО -->
  <text x="645" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">Стало (2/2): Liquibase + validate</text>
  <!-- Liquibase -->
  <rect x="525" y="90" width="240" height="56" rx="10" fill="#2563eb"/>
  <text x="645" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Liquibase (міграції)</text>
  <text x="645" y="133" text-anchor="middle" font-size="12" fill="#e0f2fe">створює схему з changeSet'ів</text>
  <line x1="645" y1="146" x2="645" y2="196" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <!-- DB -->
  <rect x="545" y="200" width="200" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="645" y="224" text-anchor="middle" font-size="14" fill="#334155">Таблиці в PostgreSQL</text>
  <text x="645" y="243" text-anchor="middle" font-size="12" fill="#64748b">схема під версіями</text>
  <!-- Hibernate validate -->
  <line x1="645" y1="256" x2="645" y2="286" stroke="#94a3b8" stroke-width="2" marker-end="url(#g)"/>
  <rect x="525" y="290" width="240" height="92" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
  <text x="645" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Hibernate: лише validate</text>
  <text x="645" y="333" text-anchor="middle" font-size="12" fill="#64748b">перевіряє, що таблиці</text>
  <text x="645" y="351" text-anchor="middle" font-size="12" fill="#64748b">відповідають сутностям,</text>
  <text x="645" y="369" text-anchor="middle" font-size="12" fill="#64748b">але нічого не змінює</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
