<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="sans-serif">
  <rect width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#334155">Структура набору змін Liquibase</text>

  <!-- master -->
  <rect x="285" y="58" width="250" height="58" rx="10" fill="#2563eb"/>
  <text x="410" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">db.changelog-master.yaml</text>
  <text x="410" y="101" text-anchor="middle" font-size="12" fill="#e0f2fe">головний файл: include по черзі</text>

  <!-- arrows to two includes -->
  <line x1="410" y1="116" x2="230" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <line x1="410" y1="116" x2="590" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <!-- 001 -->
  <rect x="70" y="172" width="320" height="66" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="230" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">001-create-products.yaml</text>
  <text x="230" y="216" text-anchor="middle" font-size="12" fill="#64748b">changeSet: createTable + зовнішні ключі</text>
  <text x="230" y="232" text-anchor="middle" font-size="12" fill="#64748b">(структура — порожні таблиці)</text>

  <!-- 002 -->
  <rect x="430" y="172" width="320" height="66" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="590" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">002-seed-products.yaml</text>
  <text x="590" y="216" text-anchor="middle" font-size="12" fill="#64748b">changeSet: insert стартових</text>
  <text x="590" y="232" text-anchor="middle" font-size="12" fill="#64748b">товарів (дані)</text>

  <!-- arrows down to DB -->
  <line x1="230" y1="238" x2="230" y2="286" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <line x1="590" y1="238" x2="590" y2="286" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>

  <!-- DB box -->
  <rect x="150" y="290" width="520" height="150" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="410" y="314" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">PostgreSQL</text>

  <rect x="175" y="330" width="150" height="92" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="250" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">products</text>
  <text x="250" y="372" text-anchor="middle" font-size="11" fill="#64748b">id, name, price,</text>
  <text x="250" y="388" text-anchor="middle" font-size="11" fill="#64748b">image_url,</text>
  <text x="250" y="404" text-anchor="middle" font-size="11" fill="#64748b">description, category</text>

  <rect x="340" y="330" width="150" height="92" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="415" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">product_images</text>
  <text x="415" y="372" text-anchor="middle" font-size="11" fill="#64748b">product_id,</text>
  <text x="415" y="388" text-anchor="middle" font-size="11" fill="#64748b">image_url,</text>
  <text x="415" y="404" text-anchor="middle" font-size="11" fill="#64748b">position</text>

  <rect x="505" y="330" width="150" height="92" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="580" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">product_characteristics</text>
  <text x="580" y="372" text-anchor="middle" font-size="11" fill="#64748b">product_id, char_name,</text>
  <text x="580" y="388" text-anchor="middle" font-size="11" fill="#64748b">char_value,</text>
  <text x="580" y="404" text-anchor="middle" font-size="11" fill="#64748b">position</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
