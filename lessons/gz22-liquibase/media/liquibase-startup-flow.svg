<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620" font-family="sans-serif">
  <rect width="700" height="620" fill="#f8fafc"/>
  <text x="350" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#334155">Що робить Liquibase при старті застосунку</text>

  <!-- 1 -->
  <rect x="100" y="62" width="500" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="350" y="86" text-anchor="middle" font-size="14" fill="#334155">Старт застосунку (SpringApplication.run)</text>
  <text x="350" y="106" text-anchor="middle" font-size="12.5" fill="#64748b">є залежність liquibase-core → міграції запускаються</text>
  <line x1="350" y1="118" x2="350" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>

  <!-- 2 -->
  <rect x="100" y="154" width="500" height="56" rx="10" fill="#2563eb"/>
  <text x="350" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Liquibase читає master changelog</text>
  <text x="350" y="198" text-anchor="middle" font-size="12.5" fill="#e0f2fe">db/changelog/db.changelog-master.yaml</text>
  <line x1="350" y1="210" x2="350" y2="242" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <!-- 3 -->
  <rect x="100" y="246" width="500" height="56" rx="10" fill="#2563eb"/>
  <text x="350" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Звіряє з таблицею DATABASECHANGELOG</text>
  <text x="350" y="290" text-anchor="middle" font-size="12.5" fill="#e0f2fe">які changeSet'и вже застосовано</text>
  <line x1="350" y1="302" x2="350" y2="334" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <!-- 4 -->
  <rect x="100" y="338" width="500" height="56" rx="10" fill="#2563eb"/>
  <text x="350" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Застосовує ЛИШЕ нові changeSet'и по черзі</text>
  <text x="350" y="382" text-anchor="middle" font-size="12.5" fill="#e0f2fe">уже застосовані пропускає, не повторює</text>
  <line x1="350" y1="394" x2="350" y2="426" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <!-- 5 -->
  <rect x="100" y="430" width="500" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="350" y="454" text-anchor="middle" font-size="14" fill="#334155">Записує кожен застосований changeSet</text>
  <text x="350" y="474" text-anchor="middle" font-size="12.5" fill="#64748b">новий рядок у таблиці DATABASECHANGELOG</text>
  <line x1="350" y1="486" x2="350" y2="518" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>

  <!-- 6 -->
  <rect x="100" y="522" width="500" height="56" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="350" y="546" text-anchor="middle" font-size="14" fill="#334155">Hibernate validate: схема відповідає сутностям?</text>
  <text x="350" y="566" text-anchor="middle" font-size="12.5" fill="#64748b">так → старт триває; ні → застосунок не стартує</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
