<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="sans-serif">
  <rect width="800" height="560" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#334155">Що робить Liquibase при старті застосунку</text>

  <!-- 1 -->
  <rect x="250" y="60" width="300" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="83" text-anchor="middle" font-size="13.5" fill="#334155">Старт застосунку (SpringApplication.run)</text>
  <text x="400" y="101" text-anchor="middle" font-size="12" fill="#64748b">є залежність liquibase-core → автозапуск</text>
  <line x1="400" y1="112" x2="400" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>

  <!-- 2 -->
  <rect x="250" y="146" width="300" height="52" rx="10" fill="#2563eb"/>
  <text x="400" y="169" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Liquibase читає master changelog</text>
  <text x="400" y="187" text-anchor="middle" font-size="12" fill="#e0f2fe">db/changelog/db.changelog-master.yaml</text>
  <line x1="400" y1="198" x2="400" y2="228" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <!-- 3 -->
  <rect x="230" y="232" width="340" height="56" rx="10" fill="#2563eb"/>
  <text x="400" y="255" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Звіряє зі службовою таблицею DATABASECHANGELOG</text>
  <text x="400" y="274" text-anchor="middle" font-size="12" fill="#e0f2fe">які changeSet'и вже застосовано</text>
  <line x1="400" y1="288" x2="400" y2="318" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <!-- 4 -->
  <rect x="230" y="322" width="340" height="56" rx="10" fill="#2563eb"/>
  <text x="400" y="345" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Застосовує ЛИШЕ нові changeSet'и по черзі</text>
  <text x="400" y="364" text-anchor="middle" font-size="12" fill="#e0f2fe">уже застосовані пропускає (не повторює)</text>
  <line x1="400" y1="378" x2="400" y2="408" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <!-- 5 -->
  <rect x="250" y="412" width="300" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="435" text-anchor="middle" font-size="13.5" fill="#334155">Записує кожен застосований changeSet</text>
  <text x="400" y="453" text-anchor="middle" font-size="12" fill="#64748b">рядок у DATABASECHANGELOG</text>
  <line x1="400" y1="464" x2="400" y2="494" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>

  <!-- 6 -->
  <rect x="250" y="498" width="300" height="52" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="400" y="521" text-anchor="middle" font-size="13.5" fill="#334155">Hibernate validate: схема = сутностям?</text>
  <text x="400" y="539" text-anchor="middle" font-size="12" fill="#64748b">так → старт триває; ні → застосунок падає</text>

  <!-- lock note -->
  <rect x="600" y="232" width="180" height="146" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="690" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">DATABASECHANGELOGLOCK</text>
  <text x="690" y="282" text-anchor="middle" font-size="11.5" fill="#64748b">блокування: лише один</text>
  <text x="690" y="300" text-anchor="middle" font-size="11.5" fill="#64748b">екземпляр Liquibase</text>
  <text x="690" y="318" text-anchor="middle" font-size="11.5" fill="#64748b">мігрує схему за раз —</text>
  <text x="690" y="336" text-anchor="middle" font-size="11.5" fill="#64748b">щоб два процеси не</text>
  <text x="690" y="354" text-anchor="middle" font-size="11.5" fill="#64748b">змінювали її одночасно</text>
  <line x1="600" y1="300" x2="572" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#g)"/>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
