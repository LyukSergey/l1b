<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" font-family="sans-serif">
  <rect width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#334155">Polyglot persistence: різні дані — різні сховища</text>

  <!-- застосунок -->
  <rect x="310" y="60" width="200" height="54" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="410" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">AmazonUA (застосунок)</text>
  <text x="410" y="101" text-anchor="middle" font-size="12" fill="#64748b">один бекенд, два сховища</text>

  <line x1="360" y1="114" x2="230" y2="156" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <line x1="460" y1="114" x2="590" y2="156" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <!-- Postgres -->
  <rect x="60" y="160" width="330" height="230" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="225" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">PostgreSQL — товари</text>
  <text x="225" y="208" text-anchor="middle" font-size="12.5" fill="#334155">таблиця products (ФІКСОВАНА схема)</text>
  <rect x="90" y="224" width="270" height="130" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="225" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">id · name · price · category …</text>
  <text x="225" y="270" text-anchor="middle" font-size="11.5" fill="#64748b">структуровані дані, зв'язки,</text>
  <text x="225" y="288" text-anchor="middle" font-size="11.5" fill="#64748b">транзакції, точні фільтри,</text>
  <text x="225" y="306" text-anchor="middle" font-size="11.5" fill="#64748b">повнотекстовий пошук (FTS)</text>
  <text x="225" y="336" text-anchor="middle" font-size="11.5" fill="#94a3b8">сильна сторона реляційної БД</text>

  <!-- Mongo -->
  <rect x="430" y="160" width="330" height="230" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="595" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">MongoDB — відгуки</text>
  <text x="595" y="208" text-anchor="middle" font-size="12.5" fill="#334155">колекція reviews (ГНУЧКІ документи)</text>
  <rect x="460" y="224" width="270" height="130" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="595" y="246" text-anchor="middle" font-size="11.5" fill="#334155">{ productId, author, rating,</text>
  <text x="595" y="264" text-anchor="middle" font-size="11.5" fill="#334155">text, createdAt, … }</text>
  <text x="595" y="288" text-anchor="middle" font-size="11.5" fill="#64748b">різна структура, вкладені поля,</text>
  <text x="595" y="306" text-anchor="middle" font-size="11.5" fill="#64748b">без міграцій схеми</text>
  <text x="595" y="336" text-anchor="middle" font-size="11.5" fill="#94a3b8">сильна сторона документної БД</text>

  <text x="410" y="414" text-anchor="middle" font-size="12" fill="#64748b">зв'язок між сховищами (productId) забезпечує застосунок — у Mongo немає зовнішнього ключа на products</text>

  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#2563eb"/></marker>
  </defs>
</svg>
