<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" font-family="sans-serif">
  <rect width="860" height="250" fill="#f8fafc"/>
  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#334155">Додавання відгуку крізь шари</text>

  <rect x="20" y="86" width="170" height="86" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="105" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">ReviewController</text>
  <text x="105" y="138" text-anchor="middle" font-size="11" fill="#64748b">POST /{id}/reviews</text>
  <text x="105" y="154" text-anchor="middle" font-size="11" fill="#64748b">@Valid ReviewRequest</text>

  <rect x="230" y="86" width="190" height="86" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="325" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">ReviewService</text>
  <text x="325" y="134" text-anchor="middle" font-size="11" fill="#64748b">перевіряє, що товар існує</text>
  <text x="325" y="150" text-anchor="middle" font-size="11" fill="#64748b">(ProductRepository → Postgres)</text>

  <rect x="460" y="86" width="190" height="86" rx="10" fill="#2563eb"/>
  <text x="555" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">ReviewRepository</text>
  <text x="555" y="134" text-anchor="middle" font-size="11" fill="#e0f2fe">MongoRepository.save()</text>
  <text x="555" y="150" text-anchor="middle" font-size="11" fill="#e0f2fe">(id генерує Mongo)</text>

  <rect x="690" y="86" width="150" height="86" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="765" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">MongoDB</text>
  <text x="765" y="138" text-anchor="middle" font-size="11" fill="#64748b">колекція reviews</text>
  <text x="765" y="154" text-anchor="middle" font-size="11" fill="#64748b">(документ)</text>

  <line x1="190" y1="129" x2="226" y2="129" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <line x1="420" y1="129" x2="456" y2="129" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <line x1="650" y1="129" x2="686" y2="129" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <text x="430" y="212" text-anchor="middle" font-size="12" fill="#64748b">товару немає в Postgres → 404; інакше відгук зберігається документом у MongoDB (polyglot persistence)</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#2563eb"/></marker>
  </defs>
</svg>
