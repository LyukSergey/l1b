<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="sans-serif">
  <rect width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#334155">Повнотекстовий пошук у PostgreSQL</text>

  <!-- ДОКУМЕНТ (індексування) -->
  <text x="210" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">Індексування (один раз / при зміні)</text>
  <rect x="70" y="84" width="280" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="210" y="106" text-anchor="middle" font-size="13" fill="#334155">текст товару: name + description</text>
  <text x="210" y="124" text-anchor="middle" font-size="12" fill="#64748b">«Навушники бездротові …»</text>
  <line x1="210" y1="136" x2="210" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <rect x="70" y="172" width="280" height="46" rx="10" fill="#2563eb"/>
  <text x="210" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">to_tsvector('simple', …)</text>
  <text x="210" y="211" text-anchor="middle" font-size="11.5" fill="#e0f2fe">нормалізує текст у лексеми</text>
  <line x1="210" y1="218" x2="210" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <rect x="70" y="254" width="280" height="70" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="210" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">стовпець search_vector (tsvector)</text>
  <text x="210" y="298" text-anchor="middle" font-size="11.5" fill="#64748b">+ GIN-індекс → швидкий пошук</text>
  <text x="210" y="315" text-anchor="middle" font-size="11.5" fill="#64748b">(тригер оновлює при insert/update)</text>

  <!-- ЗАПИТ -->
  <text x="610" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">Пошуковий запит</text>
  <rect x="470" y="84" width="280" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="610" y="106" text-anchor="middle" font-size="13" fill="#334155">запит користувача (рядок)</text>
  <text x="610" y="124" text-anchor="middle" font-size="12" fill="#64748b">«навушники бездротові»</text>
  <line x1="610" y1="136" x2="610" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <rect x="470" y="172" width="280" height="46" rx="10" fill="#2563eb"/>
  <text x="610" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">plainto_tsquery('simple', …)</text>
  <text x="610" y="211" text-anchor="middle" font-size="11.5" fill="#e0f2fe">→ tsquery (слова через AND)</text>
  <line x1="610" y1="218" x2="610" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <rect x="470" y="254" width="280" height="46" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="610" y="282" text-anchor="middle" font-size="13" fill="#334155">tsquery (готовий запит)</text>

  <!-- ЗБІГ -->
  <line x1="350" y1="289" x2="398" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <line x1="610" y1="300" x2="420" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <rect x="210" y="344" width="400" height="56" rx="10" fill="#2563eb"/>
  <text x="410" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">search_vector @@ tsquery  →  ts_rank (релевантність)</text>
  <text x="410" y="388" text-anchor="middle" font-size="11.5" fill="#e0f2fe">оператор @@ = збіг; ts_rank упорядковує за релевантністю</text>
  <line x1="410" y1="400" x2="410" y2="428" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <rect x="250" y="432" width="320" height="34" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="410" y="454" text-anchor="middle" font-size="13" fill="#334155">знайдені товари, відсортовані за релевантністю</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#2563eb"/></marker>
  </defs>
</svg>
