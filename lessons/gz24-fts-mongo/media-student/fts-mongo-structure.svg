<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="sans-serif">
  <rect width="820" height="400" fill="#f8fafc"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#334155">Цільова структура (приклад: книгарня)</text>

  <!-- FTS гілка -->
  <text x="210" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">Повнотекстовий пошук (PostgreSQL)</text>
  <rect x="60" y="80" width="300" height="60" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="210" y="104" text-anchor="middle" font-size="12.5" fill="#334155">міграція: books.search_vector tsvector</text>
  <text x="210" y="124" text-anchor="middle" font-size="11.5" fill="#64748b">+ GIN-індекс + тригер</text>
  <line x1="210" y1="140" x2="210" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <rect x="60" y="174" width="300" height="60" rx="10" fill="#2563eb"/>
  <text x="210" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">BookJpaRepository.searchFullText</text>
  <text x="210" y="218" text-anchor="middle" font-size="11.5" fill="#e0f2fe">@Query nativeQuery: @@ + ts_rank</text>
  <line x1="210" y1="234" x2="210" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <rect x="60" y="268" width="300" height="50" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="210" y="298" text-anchor="middle" font-size="12.5" fill="#334155">GET /api/books/search?q=…</text>

  <!-- Mongo гілка -->
  <text x="610" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">Документи (MongoDB)</text>
  <rect x="460" y="80" width="300" height="60" rx="10" fill="#2563eb"/>
  <text x="610" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">@Document("comments") Comment</text>
  <text x="610" y="124" text-anchor="middle" font-size="11.5" fill="#e0f2fe">bookId, author, rating, text, createdAt</text>
  <line x1="610" y1="140" x2="610" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <rect x="460" y="174" width="300" height="60" rx="10" fill="#2563eb"/>
  <text x="610" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">CommentRepository</text>
  <text x="610" y="218" text-anchor="middle" font-size="11.5" fill="#e0f2fe">extends MongoRepository</text>
  <line x1="610" y1="234" x2="610" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <rect x="460" y="268" width="300" height="50" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="610" y="298" text-anchor="middle" font-size="12.5" fill="#334155">GET/POST /api/books/{id}/comments</text>

  <text x="410" y="362" text-anchor="middle" font-size="12" fill="#64748b">книги — у PostgreSQL; коментарі — у MongoDB (polyglot persistence)</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#2563eb"/></marker>
  </defs>
</svg>
