<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="860" height="360" fill="#f8fafc"/>

  <!-- Traditional -->
  <text x="215" y="40" font-family="sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">Традиційно</text>
  <rect x="50" y="70" width="330" height="180" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="215" y="100" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Сервер Tomcat</text>
  <text x="215" y="120" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">встановлено окремо</text>
  <rect x="100" y="150" width="230" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="215" y="190" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">застосунок (.war)</text>
  <path d="M215,268 L215,224" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="288" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">застосунок «вкладають» у сервер</text>

  <!-- Spring Boot -->
  <text x="645" y="40" font-family="sans-serif" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Spring Boot</text>
  <rect x="480" y="70" width="330" height="180" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="645" y="100" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">застосунок (.jar)</text>
  <text x="645" y="120" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">самодостатній</text>
  <rect x="530" y="150" width="230" height="70" rx="10" fill="#2563eb"/>
  <text x="645" y="190" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Tomcat (бібліотека всередині)</text>
  <text x="645" y="288" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">сервер усередині застосунку</text>

  <text x="430" y="335" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">вбудований сервер: запуск однією командою, без окремого встановлення</text>
</svg>
