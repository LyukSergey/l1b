<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#f8fafc"/>

  <!-- top row: request down the layers -->
  <rect x="30" y="70" width="150" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="95" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">HTTP GET</text>
  <text x="105" y="113" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">/api/products</text>

  <rect x="230" y="70" width="170" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="315" y="103" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">ProductController</text>

  <rect x="450" y="70" width="170" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="535" y="103" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">ProductService</text>

  <rect x="670" y="70" width="180" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="760" y="103" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">ProductRepository</text>

  <path d="M182,98 L228,98" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M402,98 L448,98" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M622,98 L668,98" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- return path -->
  <rect x="450" y="200" width="220" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="560" y="233" font-family="sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">ProductMapper: Product → DTO</text>

  <rect x="230" y="200" width="150" height="56" rx="10" fill="#2563eb"/>
  <text x="305" y="233" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">JSON</text>

  <path d="M760,128 C760,170 700,228 672,228" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M448,228 L382,228" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <text x="440" y="300" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">запит іде вниз по шарах, відповідь перетворюється в DTO і повертається як JSON</text>
</svg>
