<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#f8fafc"/>

  <!-- Configuration metadata input -->
  <rect x="30" y="150" width="190" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="180" font-family="sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">метадані конфігурації</text>
  <text x="125" y="202" font-family="monospace" font-size="12" fill="#2563eb" text-anchor="middle">@Service @Repository</text>
  <text x="125" y="220" font-family="monospace" font-size="12" fill="#2563eb" text-anchor="middle">@RestController</text>
  <path d="M222,195 L270,195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Container -->
  <rect x="280" y="50" width="540" height="300" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="550" y="82" font-family="sans-serif" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">ApplicationContext (контейнер)</text>

  <!-- Beans -->
  <rect x="400" y="100" width="300" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="130" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">ProductController</text>
  <rect x="400" y="180" width="300" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="210" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">ProductServiceImpl</text>
  <rect x="400" y="260" width="300" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="290" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">InMemoryProductRepository</text>

  <path d="M550,148 L550,178" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M550,228 L550,258" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="550" y="378" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">читає анотації → створює біни → зв'язує → тримає у собі</text>
</svg>
