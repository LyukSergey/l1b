<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#f8fafc"/>
  <text x="440" y="36" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Проксіювання запитів у режимі розробки</text>

  <rect x="30" y="110" width="180" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="150" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">Браузер</text>

  <rect x="330" y="110" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="143" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Сервер розробки Vite</text>
  <text x="440" y="164" font-family="monospace" font-size="13" fill="#2563eb" text-anchor="middle">:5173</text>

  <rect x="670" y="110" width="200" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="770" y="143" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">Сервер застосунку</text>
  <text x="770" y="164" font-family="monospace" font-size="13" fill="#334155" text-anchor="middle">:8080</text>

  <path d="M212,145 L328,145" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="135" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">GET /api/products</text>
  <text x="270" y="200" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(на :5173)</text>

  <path d="M552,145 L668,145" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="610" y="135" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">проксі → :8080</text>

  <text x="440" y="265" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">у браузері видно :5173, бо запит іде на сервер розробки, а він пересилає на :8080</text>
</svg>
