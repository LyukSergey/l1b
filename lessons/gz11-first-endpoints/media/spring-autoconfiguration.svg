<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#f8fafc"/>
  <text x="440" y="36" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Автоконфігурація Spring Boot</text>

  <!-- condition -->
  <rect x="30" y="110" width="210" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="135" y="145" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">на classpath є</text>
  <text x="135" y="168" font-family="monospace" font-size="12" fill="#2563eb" text-anchor="middle">spring-boot-</text>
  <text x="135" y="185" font-family="monospace" font-size="12" fill="#2563eb" text-anchor="middle">starter-web</text>

  <!-- mechanism -->
  <rect x="300" y="115" width="230" height="80" rx="10" fill="#2563eb"/>
  <text x="415" y="150" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">@EnableAuto-</text>
  <text x="415" y="170" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Configuration</text>

  <path d="M242,155 L298,155" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M532,155 L588,155" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- results -->
  <rect x="590" y="92" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="117" font-family="monospace" font-size="13" fill="#334155" text-anchor="middle">DispatcherServlet</text>
  <rect x="590" y="140" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="165" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">вбудований Tomcat</text>
  <rect x="590" y="188" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="213" font-family="monospace" font-size="13" fill="#334155" text-anchor="middle">Jackson (JSON)</text>

  <text x="440" y="285" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">автоконфігурація: Spring Boot сам налаштовує те, що є у проєкті</text>
</svg>
