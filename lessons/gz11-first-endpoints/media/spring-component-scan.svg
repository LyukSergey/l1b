<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#f8fafc"/>

  <rect x="310" y="30" width="260" height="56" rx="10" fill="#2563eb"/>
  <text x="440" y="58" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">@SpringBootApplication</text>
  <text x="440" y="76" font-family="monospace" font-size="11" fill="#dbeafe" text-anchor="middle">com.ua.amazonua</text>

  <!-- scan cone -->
  <path d="M440,88 L160,160 L720,160 Z" fill="#dbeafe" opacity="0.6"/>
  <text x="440" y="135" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">сканування пакета і підпакетів</text>

  <!-- scanned classes (beans) -->
  <g font-family="monospace" font-size="11">
    <rect x="40" y="185" width="190" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="135" y="208" fill="#2563eb" text-anchor="middle">@RestController</text>
    <text x="135" y="226" fill="#334155" text-anchor="middle" font-family="sans-serif">ProductController</text>

    <rect x="250" y="185" width="190" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="345" y="208" fill="#2563eb" text-anchor="middle">@Service</text>
    <text x="345" y="226" fill="#334155" text-anchor="middle" font-family="sans-serif">ProductServiceImpl</text>

    <rect x="460" y="185" width="190" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="555" y="208" fill="#2563eb" text-anchor="middle">@Repository</text>
    <text x="555" y="226" fill="#334155" text-anchor="middle" font-family="sans-serif">InMemoryProductRepository</text>

    <rect x="670" y="185" width="170" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="755" y="208" fill="#2563eb" text-anchor="middle">@Component</text>
    <text x="755" y="226" fill="#334155" text-anchor="middle" font-family="sans-serif">ProductMapper</text>
  </g>

  <!-- non-bean -->
  <rect x="355" y="280" width="170" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="440" y="300" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">ProductCardDto (record)</text>
  <text x="440" y="318" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">без анотації → не бін</text>

  <text x="440" y="365" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">@ComponentScan сканує пакет застосунку і реєструє класи з анотаціями як біни</text>
</svg>
