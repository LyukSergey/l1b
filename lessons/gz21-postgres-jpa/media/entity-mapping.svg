<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#f8fafc"/>
  <text x="440" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Доменна модель → таблиці PostgreSQL</text>

  <!-- entity -->
  <rect x="40" y="80" width="300" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="106" font-family="monospace" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">@Entity Product</text>
  <g font-family="monospace" font-size="12" fill="#334155">
    <text x="60" y="134">@Id @GeneratedValue id</text>
    <text x="60" y="158">name, price, category</text>
    <text x="60" y="182">imageUrl, description</text>
    <text x="60" y="210" fill="#2563eb">@ElementCollection images</text>
    <text x="60" y="234" fill="#2563eb">@ElementCollection</text>
    <text x="78" y="254" fill="#2563eb">characteristics</text>
  </g>

  <!-- tables -->
  <rect x="520" y="70" width="320" height="70" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="680" y="94" font-family="monospace" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">products</text>
  <text x="680" y="116" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">id, name, price, category, …</text>

  <rect x="520" y="160" width="320" height="62" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="680" y="184" font-family="monospace" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">product_images</text>
  <text x="680" y="206" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">product_id (FK), image_url, position</text>

  <rect x="520" y="242" width="320" height="62" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="680" y="266" font-family="monospace" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">product_characteristics</text>
  <text x="680" y="288" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">product_id (FK), char_name, char_value</text>

  <path d="M342,130 L518,105" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M342,205 L518,190" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M342,248 L518,272" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="440" y="340" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">списки (images, characteristics) — окремі таблиці, зв'язані зовнішнім ключем product_id</text>
  <text x="440" y="362" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Characteristic — @Embeddable (без власного id); char_value, бо VALUE — зарезервоване слово SQL</text>
</svg>
