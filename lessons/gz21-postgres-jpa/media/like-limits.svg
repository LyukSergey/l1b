<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <rect width="880" height="400" fill="#f8fafc"/>
  <text x="440" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Пошук через LIKE: що легко, а що погано</text>

  <!-- easy column -->
  <rect x="40" y="70" width="380" height="300" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="40" y="70" width="380" height="44" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="98" font-family="sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">Реляційна БД робить ЛЕГКО</text>
  <g font-family="sans-serif" font-size="13" fill="#334155">
    <text x="60" y="146">• діапазон ціни: price BETWEEN</text>
    <text x="60" y="178">• фільтр за полем (категорія)</text>
    <text x="60" y="210">• точні структуровані умови</text>
    <text x="60" y="242">• добре індексується, швидко</text>
  </g>
  <text x="230" y="300" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">WHERE price &gt;= 1000 AND price &lt;= 2000</text>
  <text x="230" y="340" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">сильна сторона реляційної БД</text>

  <!-- hard column -->
  <rect x="460" y="70" width="380" height="300" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="460" y="70" width="380" height="44" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="650" y="98" font-family="sans-serif" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">Текстовий пошук через LIKE</text>
  <g font-family="sans-serif" font-size="12" fill="#334155">
    <text x="480" y="146">• лише точний підрядок</text>
    <text x="480" y="178">• "наушники" НЕ знайде "Навушники"</text>
    <text x="480" y="210">• немає ранжування релевантності</text>
    <text x="480" y="242">• %...% не бере індекс → повний скан</text>
  </g>
  <text x="650" y="300" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">LOWER(name) LIKE '%наушники%'</text>
  <text x="650" y="322" font-family="monospace" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">→ 0 результатів</text>
  <text x="650" y="352" font-family="sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">повноцінний пошук так НЕМОЖЛИВО</text>

  <text x="440" y="392" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">рішення: PostgreSQL FTS (tsvector, 2.4) або OpenSearch (3.1)</text>
</svg>
