<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#f8fafc"/>
  <text x="440" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Заміна сховища без зміни верхніх шарів (DIP)</text>

  <!-- controller + service (unchanged) -->
  <rect x="300" y="70" width="280" height="50" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="440" y="100" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">ProductController → ProductService</text>
  <text x="440" y="140" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">НЕ змінюються</text>

  <!-- interface -->
  <rect x="320" y="165" width="240" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="190" font-family="monospace" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">ProductRepository</text>
  <text x="440" y="210" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">інтерфейс (контракт сховища)</text>

  <path d="M440,120 L440,163" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="148" font-family="sans-serif" font-size="11" fill="#64748b">залежить від інтерфейсу</text>

  <!-- two implementations -->
  <rect x="80" y="300" width="300" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="230" y="326" font-family="monospace" font-size="13" fill="#64748b" text-anchor="middle">InMemoryProductRepository</text>
  <text x="230" y="348" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Модуль 1 · @Profile("inmemory")</text>
  <text x="230" y="368" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">ConcurrentHashMap (у пам'яті)</text>

  <rect x="500" y="300" width="300" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="650" y="326" font-family="monospace" font-size="12" fill="#2563eb" text-anchor="middle">JpaProductRepositoryAdapter</text>
  <text x="650" y="348" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">Заняття 2/1 · @Primary</text>
  <text x="650" y="368" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">PostgreSQL через Spring Data JPA</text>

  <path d="M230,298 L400,224" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M650,298 L480,224" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="265" font-family="sans-serif" font-size="11" fill="#94a3b8">реалізує</text>
  <text x="560" y="265" font-family="sans-serif" font-size="11" fill="#2563eb">реалізує</text>

  <text x="440" y="408" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">щоб перейти на БД — підставили іншу реалізацію ТОГО САМОГО інтерфейсу</text>
</svg>
