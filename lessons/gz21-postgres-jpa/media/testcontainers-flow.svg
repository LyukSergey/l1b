<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#f8fafc"/>
  <text x="440" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Testcontainers: реальна БД на час тестів</text>

  <!-- test run -->
  <rect x="40" y="80" width="200" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="110" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">./mvnw test</text>
  <text x="140" y="134" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">@SpringBootTest</text>
  <text x="140" y="152" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">@ServiceConnection</text>

  <!-- postgres container -->
  <rect x="340" y="70" width="240" height="110" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="460" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Docker-контейнер</text>
  <text x="460" y="120" font-family="monospace" font-size="12" fill="#2563eb" text-anchor="middle">postgres:16-alpine</text>
  <text x="460" y="144" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">стартує автоматично,</text>
  <text x="460" y="162" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">url/user/pass → у datasource</text>

  <path d="M242,125 L338,125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="114" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">піднімає</text>

  <!-- ryuk -->
  <rect x="680" y="70" width="170" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="765" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Ryuk</text>
  <text x="765" y="118" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">прибиральник</text>
  <text x="765" y="134" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">контейнерів</text>
  <text x="765" y="158" font-family="sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">у нас ВИМКНЕНО</text>
  <text x="765" y="174" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(не монтує сокет Rancher)</text>

  <path d="M580,125 L678,125" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="628" y="114" font-family="sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">стежив би</text>

  <!-- cleanup -->
  <rect x="200" y="230" width="480" height="70" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="440" y="258" font-family="sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Прибирання контейнера</text>
  <text x="440" y="282" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">при нормальному завершенні JVM — автоматично (навіть без Ryuk)</text>

  <path d="M460,180 L440,228" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="440" y="350" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">МІНУС вимкненого Ryuk: при аварії (kill -9, збій) контейнер ЗАЛИШИТЬСЯ висіти</text>
  <text x="440" y="372" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">бо саме Ryuk прибирав ресурси після аварійних завершень — тоді чистимо вручну</text>
</svg>
