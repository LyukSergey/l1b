<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#f8fafc"/>
  <text x="440" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Межі транзакції та завантаження колекцій</text>

  <!-- timeline -->
  <line x1="60" y1="130" x2="820" y2="130" stroke="#94a3b8" stroke-width="2"/>

  <!-- transaction span (service method) -->
  <rect x="150" y="100" width="420" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="124" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">@Transactional — метод сервісу</text>
  <text x="360" y="146" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">сесія ВІДКРИТА</text>

  <!-- events inside -->
  <text x="210" y="190" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">findById</text>
  <line x1="210" y1="160" x2="210" y2="178" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="190" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">toDetail +</text>
  <text x="360" y="205" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">List.copyOf</text>
  <line x1="360" y1="160" x2="360" y2="178" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="228" font-family="sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">колекції завантажено ✓</text>

  <text x="510" y="190" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">commit</text>
  <line x1="510" y1="160" x2="510" y2="178" stroke="#2563eb" stroke-width="1.5"/>

  <!-- after: serialization outside -->
  <rect x="590" y="100" width="200" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690" y="124" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">контролер: JSON</text>
  <text x="690" y="146" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">сесія ЗАКРИТА</text>
  <text x="690" y="190" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">у DTO — уже готові дані,</text>
  <text x="690" y="205" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">не проксі → безпечно</text>

  <!-- two kinds -->
  <rect x="120" y="270" width="320" height="80" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="280" y="296" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">@Transactional(readOnly = true)</text>
  <text x="280" y="318" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">читання (findAll, findById, search);</text>
  <text x="280" y="336" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">на рівні класу — за замовчуванням</text>

  <rect x="460" y="270" width="320" height="80" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="620" y="296" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">@Transactional</text>
  <text x="620" y="318" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">read-write для змін</text>
  <text x="620" y="336" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(create, update, delete)</text>

  <path d="M570,160 L600,160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
