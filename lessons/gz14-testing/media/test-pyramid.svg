<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <rect width="820" height="400" fill="#f8fafc"/>
  <text x="410" y="36" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Піраміда тестів</text>

  <!-- pyramid: unit (base, wide) -> integration (middle) -> e2e (top) -->
  <!-- top -->
  <path d="M410,70 L470,140 L350,140 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="120" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">E2E</text>
  <!-- middle -->
  <path d="M350,150 L470,150 L530,230 L290,230 Z" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="410" y="195" font-family="sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Інтеграційні</text>
  <text x="410" y="214" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">@WebMvcTest, MockMvc</text>
  <!-- base -->
  <path d="M290,240 L530,240 L600,330 L220,330 Z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="410" y="285" font-family="sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Модульні (unit)</text>
  <text x="410" y="304" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Mockito: сервіс, маппер</text>

  <!-- annotations -->
  <text x="660" y="110" font-family="sans-serif" font-size="12" fill="#64748b">мало, повільні,</text>
  <text x="660" y="128" font-family="sans-serif" font-size="12" fill="#64748b">широке покриття</text>
  <text x="640" y="290" font-family="sans-serif" font-size="12" fill="#64748b">багато, швидкі,</text>
  <text x="640" y="308" font-family="sans-serif" font-size="12" fill="#64748b">точні</text>

  <text x="410" y="370" font-family="sans-serif" font-size="12" fill="#334155" text-anchor="middle">більше дешевих модульних тестів унизу, менше дорогих — угорі</text>
</svg>
