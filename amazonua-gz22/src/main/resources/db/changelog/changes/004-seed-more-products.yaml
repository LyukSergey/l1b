# Зміна 004 — додаткові стартові товари (щоб пагінація була помітна одразу).
#
# ОКРЕМИЙ changeSet, а НЕ правка 002: вже застосований changeSet редагувати не можна
# (Liquibase звіряє контрольну суму й застосунок впаде). Правильний шлях додати дані —
# новий changeSet. Разом із 002 (id 1..4) і пізнішим 006 (id 13..40) це дає ~40 товарів
# → за розміру сторінки 8 пагінація працює на кілька сторінок.
#
# id 5..12 задаємо явно; наприкінці зсуваємо лічильник IDENTITY на 13.
databaseChangeLog:
  - changeSet:
      id: 004-seed-more-products
      author: amazonua
      changes:
        - insert:
            tableName: products
            columns:
              - column: {name: id, valueNumeric: 5}
              - column: {name: name, value: "Ігрова мишка RapidClick"}
              - column: {name: price, valueNumeric: 599.00}
              - column: {name: image_url, value: "/images/mouse.svg"}
