# Зміна 002 — стартові дані (seed) товарів.
#
# Раніше магазин наповнював ProductSeeder у коді (при старті, якщо БД порожня). Тепер
# стартові товари вставляє окремий changeSet міграції — так початкові дані теж під
# версіями й з'являються на будь-якій чистій БД автоматично, без запуску коду.
# ProductSeeder лишається (для профілю in-memory і як запобіжник), але на Postgres він
# побачить, що товари вже є, і нічого не додасть.
#
# id вказуємо явно (1..4), щоб рядки колекцій (product_images, product_characteristics)
# однозначно посилалися на свій товар через product_id. У Postgres колонка id — IDENTITY
# (GENERATED BY DEFAULT), тому явні значення дозволені; але лічильник IDENTITY при цьому
# НЕ зсувається сам, тож наприкінці змінюємо його так, щоб наступний згенерований id
# ішов після вставлених (інакше перший POST-товар отримав би id=1 і впав на дублікаті ключа).
databaseChangeLog:
  - changeSet:
      id: 002-seed-products
      author: amazonua
      changes:
        # --- Товар 1: Навушники ---
        - insert:
            tableName: products
            columns:
              - column: {name: id, valueNumeric: 1}
              - column: {name: name, value: "Навушники AudioPro X1"}
              - column: {name: price, valueNumeric: 1299.00}
              - column: {name: image_url, value: "/images/headphones.svg"}
              - column: {name: description, value: "Бездротові навушники з активним шумозаглушенням і автономністю до 30 годин."}
              - column: {name: category, value: "Аудіо"}
        - insert:
            tableName: product_images
            columns:
              - {column: {name: product_id, valueNumeric: 1}}
              - {column: {name: image_url, value: "/images/headphones.svg"}}
              - {column: {name: position, valueNumeric: 0}}
        - insert:
            tableName: product_images
            columns:
              - {column: {name: product_id, valueNumeric: 1}}
              - {column: {name: image_url, value: "/images/headphones-2.svg"}}
              - {column: {name: position, valueNumeric: 1}}
        - insert:
            tableName: product_characteristics
            columns:
              - {column: {name: product_id, valueNumeric: 1}}
              - {column: {name: char_name, value: "Тип"}}
              - {column: {name: char_value, value: "Накладні"}}
              - {column: {name: position, valueNumeric: 0}}
        - insert:
            tableName: product_characteristics
            columns:
              - {column: {name: product_id, valueNumeric: 1}}
              - {column: {name: char_name, value: "Підключення"}}
              - {column: {name: char_value, value: "Bluetooth 5.3"}}
              - {column: {name: position, valueNumeric: 1}}

        # --- Товар 2: Клавіатура ---
        - insert:
            tableName: products
            columns:
              - column: {name: id, valueNumeric: 2}
              - column: {name: name, value: "Клавіатура MechKey TKL"}
              - column: {name: price, valueNumeric: 1890.50}
              - column: {name: image_url, value: "/images/keyboard.svg"}
              - column: {name: description, value: "Механічна клавіатура з гарячою заміною перемикачів і RGB-підсвіткою."}
              - column: {name: category, value: "Периферія"}
        - insert:
            tableName: product_images
            columns:
              - {column: {name: product_id, valueNumeric: 2}}
              - {column: {name: image_url, value: "/images/keyboard.svg"}}
              - {column: {name: position, valueNumeric: 0}}
        - insert:
            tableName: product_characteristics
            columns:
              - {column: {name: product_id, valueNumeric: 2}}
              - {column: {name: char_name, value: "Форм-фактор"}}
              - {column: {name: char_value, value: "TKL (87 клавіш)"}}
              - {column: {name: position, valueNumeric: 0}}
        - insert:
            tableName: product_characteristics
            columns:
              - {column: {name: product_id, valueNumeric: 2}}
              - {column: {name: char_name, value: "Перемикачі"}}
              - {column: {name: char_value, value: "Red, hot-swap"}}
              - {column: {name: position, valueNumeric: 1}}

        # --- Товар 3: Миша ---
        - insert:
            tableName: products
            columns:
              - column: {name: id, valueNumeric: 3}
              - column: {name: name, value: "Миша GlideMouse Pro"}
              - column: {name: price, valueNumeric: 749.00}
              - column: {name: image_url, value: "/images/mouse.svg"}
              - column: {name: description, value: "Легка ігрова миша з сенсором 26000 DPI і вагою 59 г."}
              - column: {name: category, value: "Периферія"}
        - insert:
            tableName: product_images
            columns:
              - {column: {name: product_id, valueNumeric: 3}}
              - {column: {name: image_url, value: "/images/mouse.svg"}}
              - {column: {name: position, valueNumeric: 0}}
        - insert:
            tableName: product_characteristics
            columns:
              - {column: {name: product_id, valueNumeric: 3}}
              - {column: {name: char_name, value: "Сенсор"}}
              - {column: {name: char_value, value: "26000 DPI"}}
              - {column: {name: position, valueNumeric: 0}}

        # --- Товар 4: Монітор ---
        - insert:
            tableName: products
            columns:
              - column: {name: id, valueNumeric: 4}
              - column: {name: name, value: "Монітор ViewMax 27\""}
              - column: {name: price, valueNumeric: 8499.00}
              - column: {name: image_url, value: "/images/monitor.svg"}
              - column: {name: description, value: "27-дюймовий IPS-монітор 2K з частотою 165 Гц для роботи та ігор."}
              - column: {name: category, value: "Монітори"}
        - insert:
            tableName: product_images
            columns:
              - {column: {name: product_id, valueNumeric: 4}}
              - {column: {name: image_url, value: "/images/monitor.svg"}}
              - {column: {name: position, valueNumeric: 0}}
        - insert:
            tableName: product_characteristics
            columns:
              - {column: {name: product_id, valueNumeric: 4}}
              - {column: {name: char_name, value: "Діагональ"}}
              - {column: {name: char_value, value: "27\""}}
              - {column: {name: position, valueNumeric: 0}}
        - insert:
            tableName: product_characteristics
            columns:
              - {column: {name: product_id, valueNumeric: 4}}
              - {column: {name: char_name, value: "Роздільність"}}
              - {column: {name: char_value, value: "2560×1440"}}
              - {column: {name: position, valueNumeric: 1}}

        # Зсуваємо лічильник IDENTITY так, щоб наступний згенерований id ішов після id=4.
        # Без цього перший товар, доданий через POST, отримав би id=1 і впав на дублікаті.
        - sql:
            sql: "ALTER TABLE products ALTER COLUMN id RESTART WITH 5"
