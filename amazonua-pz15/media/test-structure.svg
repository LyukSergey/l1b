<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#f8fafc"/>
  <text x="440" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Що тестуємо (приклад «фільмотека» Movie)</text>
  <text x="440" y="56" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">ваша сутність — власна; Movie тут лише як зразок структури</text>

  <!-- unit test -->
  <rect x="40" y="80" width="380" height="180" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="80" width="380" height="44" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="108" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Модульний (Mockito)</text>
  <text x="60" y="150" font-family="monospace" font-size="12" fill="#2563eb">MovieServiceImplTest</text>
  <g font-family="sans-serif" font-size="12" fill="#334155">
    <text x="60" y="178">• репозиторій і маппер — у сервіс через mock()</text>
    <text x="60" y="202">• when(...).thenReturn(...) задає поведінку</text>
    <text x="60" y="226">• verify(...) перевіряє виклик</text>
    <text x="60" y="250">• логіка в ізоляції, без запуску Spring</text>
  </g>

  <!-- integration test -->
  <rect x="460" y="80" width="380" height="180" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <rect x="460" y="80" width="380" height="44" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="650" y="108" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Інтеграційний (MockMvc)</text>
  <text x="480" y="150" font-family="monospace" font-size="12" fill="#0ea5e9">MovieControllerTest</text>
  <g font-family="sans-serif" font-size="12" fill="#334155">
    <text x="480" y="178">• @WebMvcTest, сервіс — @MockBean</text>
    <text x="480" y="202">• mockMvc.perform(get/post/put/delete)</text>
    <text x="480" y="226">• status() перевіряє код відповіді</text>
    <text x="480" y="250">• jsonPath(...) перевіряє JSON</text>
  </g>

  <!-- advice -->
  <rect x="240" y="300" width="400" height="80" rx="12" fill="#2563eb"/>
  <text x="440" y="330" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">@RestControllerAdvice</text>
  <text x="440" y="352" font-family="sans-serif" font-size="12" fill="#dbeafe" text-anchor="middle">глобальна обробка: 404 (не знайдено) + 400 (валідація)</text>
  <text x="440" y="370" font-family="sans-serif" font-size="11" fill="#dbeafe" text-anchor="middle">тести перевіряють структуроване тіло помилки</text>

  <path d="M230,260 L380,298" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M650,260 L500,298" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
