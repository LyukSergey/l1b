<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="sans-serif">
  <rect width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#334155">Цільова структура (приклад: книгарня, сутність Book)</text>
  <text x="430" y="54" text-anchor="middle" font-size="13" fill="#64748b">in-memory репозиторій → реалізація на JpaRepository; схему веде Liquibase</text>

  <!-- web -->
  <rect x="300" y="72" width="260" height="62" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">web: BookController</text>
  <text x="430" y="115" text-anchor="middle" font-size="12" fill="#64748b">GET /api/books (Pageable), CRUD</text>
  <line x1="430" y1="134" x2="430" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>

  <!-- service interface + impl -->
  <rect x="300" y="168" width="260" height="62" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="192" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">service: BookService (інтерфейс)</text>
  <text x="430" y="211" text-anchor="middle" font-size="12" fill="#64748b">BookServiceImpl — бізнес-логіка</text>
  <line x1="430" y1="230" x2="430" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>

  <!-- repository interface -->
  <rect x="300" y="264" width="260" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="286" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">repository: BookRepository</text>
  <text x="430" y="305" text-anchor="middle" font-size="12" fill="#64748b">інтерфейс-контракт (DIP)</text>

  <!-- two implementations -->
  <line x1="360" y1="320" x2="250" y2="366" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <line x1="500" y1="320" x2="610" y2="366" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#g)"/>

  <rect x="80" y="370" width="300" height="70" rx="10" fill="#2563eb"/>
  <text x="230" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">JpaBookRepositoryAdapter (@Primary)</text>
  <text x="230" y="413" text-anchor="middle" font-size="11.5" fill="#e0f2fe">делегує до BookJpaRepository</text>
  <text x="230" y="429" text-anchor="middle" font-size="11.5" fill="#e0f2fe">extends JpaRepository&lt;Book, Long&gt;</text>

  <rect x="480" y="370" width="300" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="630" y="398" text-anchor="middle" font-size="13" fill="#64748b">InMemoryBookRepository</text>
  <text x="630" y="418" text-anchor="middle" font-size="11.5" fill="#94a3b8">@Profile("inmemory") — лишається</text>

  <!-- DB + liquibase -->
  <line x1="230" y1="440" x2="230" y2="470" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <rect x="80" y="474" width="300" height="38" rx="9" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="230" y="498" text-anchor="middle" font-size="12.5" fill="#334155">PostgreSQL · схему створює Liquibase</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
