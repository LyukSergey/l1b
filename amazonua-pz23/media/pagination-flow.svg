<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="sans-serif">
  <rect width="880" height="250" fill="#f8fafc"/>
  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#334155">Пагінований запит крізь шари</text>

  <!-- controller -->
  <rect x="30" y="80" width="180" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">BookController</text>
  <text x="120" y="133" text-anchor="middle" font-size="11.5" fill="#64748b">приймає Pageable</text>
  <text x="120" y="150" text-anchor="middle" font-size="11.5" fill="#64748b">параметром методу</text>

  <!-- service -->
  <rect x="260" y="80" width="180" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="350" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">BookService</text>
  <text x="350" y="133" text-anchor="middle" font-size="11.5" fill="#64748b">передає Pageable</text>
  <text x="350" y="150" text-anchor="middle" font-size="11.5" fill="#64748b">у репозиторій</text>

  <!-- repo -->
  <rect x="490" y="80" width="180" height="90" rx="10" fill="#2563eb"/>
  <text x="580" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">BookJpaRepository</text>
  <text x="580" y="129" text-anchor="middle" font-size="11.5" fill="#e0f2fe">findAll(Pageable)</text>
  <text x="580" y="146" text-anchor="middle" font-size="11.5" fill="#e0f2fe">→ Page&lt;Book&gt;</text>

  <!-- db -->
  <rect x="720" y="80" width="140" height="90" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="790" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">PostgreSQL</text>
  <text x="790" y="133" text-anchor="middle" font-size="11.5" fill="#64748b">LIMIT / OFFSET</text>
  <text x="790" y="150" text-anchor="middle" font-size="11.5" fill="#64748b">+ ORDER BY</text>

  <!-- arrows right -->
  <line x1="210" y1="125" x2="256" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <line x1="440" y1="125" x2="486" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#g)"/>
  <line x1="670" y1="125" x2="716" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>

  <text x="440" y="212" text-anchor="middle" font-size="12" fill="#64748b">Pageable несе номер/розмір сторінки й сортування; БД віддає лише потрібний зріз рядків</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
